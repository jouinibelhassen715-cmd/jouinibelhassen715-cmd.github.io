      --pale: #edf4fc;
      --ink: #14233b;
      --muted: #586982;
      --line: #dce6f2;
      --white: #fff;
      --radius: 20px;
      --shadow: 0 12px 35px rgba(8, 44, 96, .09);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      margin: 0;
      font-family: "Cairo", Arial, sans-serif;
      color: var(--ink);
      line-height: 1.8;
      background: var(--white);
    }

    a { color: inherit; text-decoration: none; }

    a:focus-visible, button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 4px;
    }

    .container {
      width: min(1100px, 92%);
      margin-inline: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .navbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .logo {
      font-weight: 900;
      color: var(--navy);
      font-size: 1.2rem;
      white-space: nowrap;
    }

    nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: .9rem;
      font-weight: 700;
    }

    nav a:hover { color: var(--blue); }

    .tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang button {
      border: 1px solid var(--line);
      background: white;
      padding: 7px 10px;
      border-radius: 9px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .lang button[aria-pressed="true"] {
      background: var(--navy);
      color: white;
    }

    .hero {
      position: relative;
      overflow: hidden;
      color: white;
      padding: 82px 0 100px;
      background:

        linear-gradient(135deg, #061e42, #0a3b7d);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 340px;
      height: 340px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 50%;
      inset-inline-end: -120px;
      bottom: -180px;
      box-shadow: 0 0 0 35px rgba(255,255,255,.025),
                  0 0 0 70px rgba(255,255,255,.025);
    }

    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 55px;
      align-items: center;
    }

    .eyebrow {
      display: inline-block;
      color: #f1d69c;
      border: 1px solid rgba(217,181,109,.5);
      background: rgba(217,181,109,.08);
      padding: 5px 15px;
      border-radius: 30px;
      font-size: .9rem;
      font-weight: 700;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 6vw, 4.8rem);
      line-height: 1.12;
      letter-spacing: -.03em;
      font-weight: 900;
    }

    .role {
      color: #a9d8ff;
      font-size: clamp(1.05rem, 2.5vw, 1.4rem);
      font-weight: 800;
      margin: 20px 0 10px;
    }

    .intro {
      max-width: 620px;
      color: #e0eaf7;
      font-size: 1.05rem;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 11px 20px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: white;
      color: var(--navy);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s, background .2s;
    }

    .btn:hover { transform: translateY(-2px); }

    .btn.primary {
      background: var(--gold);
      color: #182844;
      border-color: var(--gold);
    }

    .btn.outline {
      background: transparent;
      color: white;
      border-color: rgba(255,255,255,.65);
    }

    .portrait {
      max-width: 340px;
      width: 100%;
      justify-self: center;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      object-position: center top;
      border-radius: 48% 48% 22px 22px;
      border: 5px solid rgba(255,255,255,.3);
      box-shadow: 0 24px 60px rgba(0,0,0,.25);
      background: #e8f0fa;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: -40px;
      position: relative;
      z-index: 2;
    }

    .stat {
      text-align: center;
      background: white;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 18px;
      padding: 22px 10px;
    }

    .stat strong {
      display: block;
      color: var(--navy);
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      font-weight: 900;
      line-height: 1.4;

      font-size: .9rem;
      font-weight: 700;

    .section-title {
      color: var(--navy);
      font-size: clamp(1.7rem, 4vw, 2.3rem);
      font-weight: 900;
      margin: 0 0 30px;
    }

    .section-title::after {
      content: "";
      display: block;
      width: 58px;
      height: 4px;
      margin-top: 10px;
      background: var(--gold);
      border-radius: 4px;
    }

    .about {
      max-width: 850px;
      font-size: 1.08rem;
      color: #35445b;
    }

    .timeline {
      display: grid;
      gap: 18px;
    }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .date {
      display: inline-block;
      background: var(--pale);
      color: var(--blue);
      border-radius: 7px;
      padding: 3px 11px;
      font-size: .85rem;
      font-weight: 800;
    }

      font-size: 1.15rem;
    }

    .company {

      font-weight: 700;
      margin: 0 0 8px;
    }

    .card ul { padding-inline-start: 22px; margin-bottom: 0; }

    .card li { margin-bottom: 5px; }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 17px;
    }

    .skill {
      border-top: 4px solid var(--gold);
    }

    .skill h3 { margin-top: 0; }

    .tags {

      flex-wrap: wrap;
      gap: 7px;

      background: var(--pale);
      color: var(--navy);
      border-radius: 7px;
      padding: 4px 10px;
      font-size: .84rem;
      font-weight: 700;
    }

      display: grid;
      gap: 12px;
    }

    .cv-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .cv-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .cv-icon { font-size: 2rem; }

    .cv-card p {

      flex: 1;
      margin: 0 0 10px;

    .cv-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

    .email {

      font-weight: 800;
      overflow-wrap: anywhere;
      border-bottom: 2px solid var(--gold);

    @media (max-width: 850px) {

      ],
      skillsTitle: "المهارات",
      skills: [

      cvs: [

      download: "تحميل",

      contactText: "منفتح على فرص العمل في تونس وأوروبا الناطقة بالفرنسية وكندا.",
      location: "تونس العاصمة، تونس",
      footer: "© " + new Date().getFullYear() + " بلحسن الجويني — جميع الحقوق محفوظة."
    }

  const $ = id => document.getElementById(id);
  let currentLang = "fr";

  function addText(tag, text, className) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    el.textContent = text;
    return el;
  }

  function render() {
    const d = content[currentLang];
    const arabic = currentLang === "ar";

    document.documentElement.lang = currentLang;
    document.documentElement.dir = arabic ? "rtl" : "ltr";

    $("nav").replaceChildren(...d.nav.map(([label, href]) => {
      const a = addText("a", label);
      a.href = "#" + href;
      return a;
    }));

    [
      ["eyebrow", "eyebrow"],
      ["role", "role"],
      ["intro", "intro"],
      ["heroCv", "heroCv"],
      ["heroContact", "heroContact"],
      ["heroAssistant", "heroAssistant"],
      ["aboutTitle", "aboutTitle"],
      ["about", "about"],
      ["expTitle", "expTitle"],
      ["skillsTitle", "skillsTitle"],
      ["eduTitle", "eduTitle"],
      ["cvTitle", "cvTitle"],
      ["cvIntro", "cvIntro"],
      ["contactTitle", "contactTitle"],
      ["emailButton", "emailButton"],
      ["contactText", "contactText"],
      ["location", "location"],
      ["footer", "footer"]
    ].forEach(([id, key]) => $(id).textContent = d[key]);

    $("stats").replaceChildren(...d.stats.map(([value, label]) => {
      const box = document.createElement("div");
      box.className = "stat";
      box.append(addText("strong", value), addText("span", label));
      return box;
    }));

    $("jobs").replaceChildren(...d.jobs.map(job => {
      const article = document.createElement("article");
      article.className = "card";
      article.append(addText("span", job.date, "date"));
      article.append(addText("h3", job.title));
      article.append(addText("p", job.company, "company"));

      const ul = document.createElement("ul");
      job.bullets.forEach(text => ul.append(addText("li", text)));
      article.append(ul);
      return article;
    }));

    $("skillsList").replaceChildren(...d.skills.map(([title, tags]) => {
      const card = document.createElement("article");
      card.className = "card skill";
      card.append(addText("h3", title));

      const tagList = document.createElement("div");
      tagList.className = "tags";
      tags.forEach(tag => tagList.append(addText("span", tag, "tag")));
      card.append(tagList);
      return card;
    }));

    $("education").replaceChildren(...d.education.map(([title, detail]) => {
      const card = document.createElement("article");
      card.className = "card";
      card.append(addText("h3", title));
      card.append(addText("p", detail));
      return card;
    }));

    $("cvList").replaceChildren(...d.cvs.map(([icon, title, desc, file]) => {
      const card = document.createElement("article");
      card.className = "card cv-card";
      card.append(addText("span", icon, "cv-icon"));
      card.append(addText("h3", title));
      card.append(addText("p", desc));

      const actions = document.createElement("div");
      actions.className = "cv-actions";

      const view = addText("a", d.view, "btn");
      view.href = file;
      view.target = "_blank";
      view.rel = "noopener noreferrer";

      const download = addText("a", d.download, "btn primary");
      download.href = file;
      download.setAttribute("download", file);

      actions.append(view, download);
      card.append(actions);
      return card;
    }));

    document.querySelectorAll("[data-lang]").forEach(button => {
      button.setAttribute(
        "aria-pressed",
        String(button.dataset.lang === currentLang)
      );
    });

    document.title = arabic
      ? "بلحسن الجويني | اللوجستيك وتسيير المخزون"
      : "Belhassen Jouini | Logistique & Gestion des stocks";

    try {
      localStorage.setItem("portfolio-language", currentLang);
    } catch (_) {}
  }

  document.querySelectorAll("[data-lang]").forEach(button => {
    button.addEventListener("click", () => {
      currentLang = button.dataset.lang;
      render();
    });
  });

  try {
    const saved = localStorage.getItem("portfolio-language");
    if (saved === "ar" || saved === "fr") currentLang = saved;
  } catch (_) {}

  render();
</script>
</body>
</html>
