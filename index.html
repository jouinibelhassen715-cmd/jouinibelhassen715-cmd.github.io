<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belhassen Jouini</title>
<meta name="description" content="Portfolio de Belhassen Jouini — حلول رقمية عملية / Solutions numériques pratiques.">
<meta name="theme-color" content="#0b1322">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1322;--bg2:#111d34;--ink:#e9eef8;--mute:#93a1ba;--line:#223250;--acc:#d9b778}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
.wrap{max-width:900px;margin:0 auto;padding:0 22px}
header{position:sticky;top:0;z-index:10;background:rgba(11,19,34,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.logo{font-weight:900;letter-spacing:.01em}
nav{display:flex;gap:22px;font-size:.92rem;color:var(--mute)}
nav a:hover{color:var(--ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:.8rem;font-weight:600}
.lang button{background:none;border:0;color:var(--mute);padding:5px 14px;cursor:pointer;font:inherit}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.hero{padding:clamp(64px,14vw,140px) 0 clamp(56px,10vw,96px)}
.hero h1{font-size:clamp(2.7rem,10vw,5.6rem);line-height:1.05;font-weight:900;letter-spacing:-.015em}
.hero .bar{width:72px;height:3px;background:var(--acc);margin:26px 0}
.role{font-size:clamp(1.15rem,3vw,1.5rem);font-weight:600;color:var(--acc)}
.lede{max-width:56ch;color:var(--mute);margin-top:14px;font-size:1.05rem}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.btn{display:inline-block;padding:11px 24px;border-radius:999px;font-weight:700;font-size:.95rem;border:1px solid var(--line);transition:border-color .2s,background .2s}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:hover{border-color:var(--acc)}
section{padding:clamp(48px,8vw,80px) 0;border-top:1px solid var(--line)}
h2{font-size:1.7rem;font-weight:800;margin-bottom:28px}
.proj{display:grid;grid-template-columns:1fr 1.7fr;gap:12px 40px;padding:28px 0;border-top:1px solid var(--line)}
.proj:first-of-type{border-top:0;padding-top:0}
.proj h3{font-size:1.5rem;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.82rem;color:var(--mute)}
.proj p{color:#c5cfe2}
.links{display:flex;gap:20px;margin-top:16px;font-weight:700;font-size:.92rem}
.links a{color:var(--acc);border-bottom:1px solid transparent}
.links a:hover{border-color:var(--acc)}
.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 40px}
.skills dt{font-weight:700}
.skills dd{color:var(--mute);font-size:.95rem}
.contact p{color:var(--mute);max-width:52ch}
.mail{display:inline-block;margin-top:18px;font-size:clamp(1.15rem,4.5vw,1.9rem);font-weight:800;direction:ltr;border-bottom:2px solid var(--acc);word-break:break-all}
.social{display:flex;gap:22px;margin-top:22px;color:var(--mute);font-weight:600}
.social a:hover{color:var(--ink)}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mute);font-size:.85rem}
.hero .wrap>*{animation:in .7s both}
.hero .wrap>*:nth-child(2){animation-delay:.08s}.hero .wrap>*:nth-child(3){animation-delay:.16s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
@media(max-width:700px){nav{display:none}.proj,.skills{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto}}
</style>
</head>
<body>
<header><div class="wrap">
<a href="#top" class="logo" dir="ltr">B. Jouini</a>
<nav id="nav"></nav>
<div class="lang" role="group" aria-label="Langue / اللغة">
<button data-l="ar" aria-pressed="true">عربي</button><button data-l="fr" aria-pressed="false">FR</button>
</div>
</div></header>

<main id="top">
<div class="hero"><div class="wrap">
<h1 id="name"></h1>
<div class="bar"></div>
<div><p class="role" id="role"></p><p class="lede" id="lede"></p>
<div class="cta"><a class="btn main" href="#projects" id="cta1"></a><a class="btn" href="#contact" id="cta2"></a></div></div>
</div></div>

<section id="projects"><div class="wrap"><h2 id="hProj"></h2><div id="projList"></div></div></section>
<section id="skills"><div class="wrap"><h2 id="hSkill"></h2><dl class="skills" id="skillList"></dl></div></section>
<section id="contact" class="contact"><div class="wrap"><h2 id="hContact"></h2><p id="contactP"></p>
<a class="mail" id="mail"></a>
<div class="social"><a id="gh" target="_blank" rel="noopener">GitHub</a></div></div></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
// ===== المحتوى: عدّل هنا فقط / Modifiez uniquement cette section =====
const P={name:'Belhassen Jouini',email:'jouinibelhassen715@gmail.com',github:'https://github.com/jouinibelhassen715-cmd'};
const C={
ar:{nav:['المشاريع','المهارات','تواصل'],
role:'أصمّم وأبني حلولاً رقمية عملية',
lede:'أحوّل الأفكار إلى تطبيقات ومواقع واضحة وسهلة الاستعمال، بالعربية والفرنسية، من التصميم إلى النشر.',
cta1:'شاهد أعمالي',cta2:'راسلني',hProj:'أعمال مختارة',hSkill:'المهارات',hContact:'لنعمل معاً',
contactP:'عندك مشروع أو فكرة؟ راسلني وسأرد عليك في أقرب وقت.',open:'افتح التطبيق',code:'الكود المصدري',
projects:[{t:'Dinar Smart',tags:['HTML','Tailwind CSS','JavaScript','Supabase'],
d:'تطبيق لإدارة المالية الشخصية بالدينار التونسي: وضع للموظف ووضع للحرفي، تتبّع المعاملات، ميزانيات بتنبيهات، أهداف ادخار، وقراءة المبلغ من صورة الفاتورة. واجهة ثنائية اللغة وبيانات مؤمَّنة لكل مستخدم.',
url:'https://dinar-smart.vercel.app',repo:P.github+'/dinar-smart'}],
skills:[['الواجهات','HTML، CSS، JavaScript، Tailwind CSS'],['البيانات والأمان','Supabase، PostgreSQL، المصادقة وصلاحيات الصفوف (RLS)'],['النشر','GitHub، Vercel'],['اللغات','العربية، الفرنسية']],
foot:'© '+new Date().getFullYear()+' Belhassen Jouini'},
fr:{nav:['Projets','Compétences','Contact'],
role:'Je conçois et construis des solutions numériques utiles',
lede:'Je transforme des idées en applications et sites clairs, en arabe et en français, de la conception à la mise en ligne.',
cta1:'Voir mes réalisations',cta2:'Me contacter',hProj:'Réalisations',hSkill:'Compétences',hContact:'Travaillons ensemble',
contactP:'Un projet, une idée ? Écrivez-moi, je réponds rapidement.',open:"Ouvrir l'application",code:'Code source',
projects:[{t:'Dinar Smart',tags:['HTML','Tailwind CSS','JavaScript','Supabase'],
d:"Application de gestion des finances personnelles en dinar tunisien : mode salarié et mode artisan, suivi des transactions, budgets avec alertes, objectifs d'épargne et lecture du montant sur une photo de facture. Interface bilingue et données protégées par utilisateur.",
url:'https://dinar-smart.vercel.app',repo:P.github+'/dinar-smart'}],
skills:[['Interfaces','HTML, CSS, JavaScript, Tailwind CSS'],['Données et sécurité','Supabase, PostgreSQL, authentification et politiques RLS'],['Déploiement','GitHub, Vercel'],['Langues','Arabe, français']],
foot:'© '+new Date().getFullYear()+' Belhassen Jouini'}
};
// =====================================================================
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function setLang(l){
const c=C[l];
document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
$('nav').innerHTML=['projects','skills','contact'].map((h,i)=>`<a href="#${h}">${esc(c.nav[i])}</a>`).join('');
$('name').textContent=P.name;$('name').dir='ltr';$('name').style.textAlign=l==='ar'?'right':'left';
['role','lede','cta1','cta2','hProj','hSkill','hContact','contactP'].forEach(k=>$(k).textContent=c[k]);
$('projList').innerHTML=c.projects.map(p=>`<article class="proj"><div><h3 dir="ltr" style="text-align:${l==='ar'?'right':'left'}">${esc(p.t)}</h3><div class="tags" dir="ltr">${p.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div></div>
<div><p>${esc(p.d)}</p><div class="links"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(c.open)}</a><a href="${esc(p.repo)}" target="_blank" rel="noopener">${esc(c.code)}</a></div></div></article>`).join('');
$('skillList').innerHTML=c.skills.map(s=>`<div><dt>${esc(s[0])}</dt><dd>${esc(s[1])}</dd></div>`).join('');
$('mail').textContent=P.email;$('mail').href='mailto:'+P.email;$('gh').href=P.github;
$('foot').textContent=c.foot;
document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
try{localStorage.setItem('pf_lang',l)}catch(e){}
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
let l0;try{l0=localStorage.getItem('pf_lang')}catch(e){}
setLang(l0==='fr'||l0==='ar'?l0:((navigator.language||'').startsWith('fr')?'fr':'ar'));
</script>
</body>
</html>
