<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Belhassen Jouini | Logistique & Gestion des stocks</title>
  <meta name="description" content="Belhassen Jouini — professionnel de la logistique, gestion des stocks, opérations d'entrepôt et e-commerce. CV disponibles pour la Tunisie, l'Europe et le Canada.">
  <meta name="theme-color" content="#0a1f3d">
  <meta name="author" content="Belhassen Jouini">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0a1f3d;
      --navy-mid: #12305a;
      --blue: #1a6fb5;
      --blue-light: #2b8fd4;
      --gold: #c9a227;
      --gold-soft: #e8d48b;
      --bg: #f4f7fb;
      --surface: #ffffff;
      --ink: #152238;
      --muted: #5a6b82;
      --line: #d8e2ef;
      --radius: 14px;
      --shadow: 0 4px 20px rgba(10, 31, 61, 0.06);
      --shadow-lg: 0 12px 40px rgba(10, 31, 61, 0.1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 88px;
    }

    body {
      font-family: "Cairo", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; height: auto; display: block; }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--blue-light);
      outline-offset: 3px;
    }

    .container {
      width: min(1080px, 92%);
      margin-inline: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }

    .navbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      font-weight: 900;
      font-size: 1.15rem;
      color: var(--navy);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    nav {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    nav a {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 8px;
      transition: color 0.15s, background 0.15s;
    }

    nav a:hover {
      color: var(--navy);
      background: #eef4fb;
    }

    .tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lang button {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      transition: all 0.15s;
    }

    .lang button[aria-pressed="true"] {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    .lang button:hover:not([aria-pressed="true"]) {
      border-color: var(--blue);
      color: var(--navy);
    }

    .hero {
      background: linear-gradient(145deg, #061529 0%, #0c2a52 55%, #0e3a6e 100%);
      color: #fff;
      padding: 72px 0 88px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 90% 10%, rgba(26, 111, 181, 0.35), transparent);
      pointer-events: none;
    }

    .hero-grid {
      position: relative;
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 48px;
      align-items: center;
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--gold-soft);
      border: 1px solid rgba(201, 162, 39, 0.4);
      background: rgba(201, 162, 39, 0.1);
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
      letter-spacing: 0.02em;
    }

    .hero h1 {
      font-size: clamp(2.4rem, 5.5vw, 3.8rem);
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }

    .role {
      font-size: clamp(1rem, 2vw, 1.2rem);
      font-weight: 700;
      color: #9ec5e8;
      margin-bottom: 14px;
    }

    .intro {
      max-width: 540px;
      color: #c5d8ec;
      font-size: 1.02rem;
      margin-bottom: 28px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 10px;
      font: inherit;
      font-weight: 800;
      font-size: 0.95rem;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      min-height: 46px;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn.primary {
      background: var(--gold);
      color: #1a1508;
      border-color: var(--gold);
    }

    .btn.primary:hover {
      background: #d4b03a;
      box-shadow: 0 6px 20px rgba(201, 162, 39, 0.35);
    }

    .btn.outline {
      background: transparent;
      color: #fff;
      border-color: rgba(255, 255, 255, 0.45);
    }

    .btn.outline:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.7);
    }

    .portrait {
      width: 100%;
      max-width: 300px;
      justify-self: center;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      object-position: center top;
      border-radius: 16px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.35);
      background: #1a3a5c;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: -36px;
      position: relative;
      z-index: 5;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px 14px;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }

    .stat strong {
      display: block;
      font-size: clamp(1.5rem, 3.5vw, 2rem);
      font-weight: 900;
      color: var(--navy);
      line-height: 1.25;
    }

    .stat span {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
    }

    section { padding: 64px 0; }
    section.alternate { background: #eaf0f7; }

    .section-title {
      font-size: clamp(1.55rem, 3.5vw, 1.95rem);
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 28px;
      letter-spacing: -0.02em;
    }

    .section-title::after {
      content: "";
      display: block;
      width: 48px;
      height: 3px;
      margin-top: 10px;
      background: var(--gold);
      border-radius: 2px;
    }

    .about {
      max-width: 780px;
      font-size: 1.05rem;
      color: #3a4a5e;
    }

    .timeline { display: grid; gap: 16px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px 24px;
      box-shadow: var(--shadow);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .card:hover {
      border-color: #b8cce3;
      box-shadow: 0 8px 28px rgba(10, 31, 61, 0.08);
    }

    .date {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--blue);
      background: #e8f1fa;
      padding: 3px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .card h3 {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 2px;
    }

    .company {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .card ul { padding-inline-start: 18px; color: #3a4a5e; }
    .card li { margin-bottom: 4px; font-size: 0.95rem; }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .skill { border-top: 3px solid var(--gold); }
    .skill h3 {
      font-size: 1rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 12px;
    }

    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--navy);
      background: #eef4fb;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .education-list { display: grid; gap: 12px; }
    .education-list .card { box-shadow: none; }

    .cv-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 8px;
    }

    .cv-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
    }

    .cv-icon { font-size: 1.6rem; line-height: 1; }
    .cv-card h3 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--navy);
    }
    .cv-card p {
      font-size: 0.9rem;
      color: var(--muted);
      flex: 1;
    }
    .cv-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .cv-card .btn {
      padding: 10px 16px;
      font-size: 0.88rem;
      min-height: 40px;
    }

    .contact-box {
      background: linear-gradient(145deg, #061529 0%, #0c2a52 60%, #0e3a6e 100%);
      color: #fff;
      border-radius: 20px;
      padding: clamp(28px, 5vw, 48px);
    }
    .contact-box .section-title { color: #fff; }
    .contact-box .section-title::after { background: var(--gold); }

    .email {
      display: inline-block;
      font-size: clamp(1.05rem, 3vw, 1.45rem);
      font-weight: 800;
      color: var(--gold-soft);
      border-bottom: 2px solid var(--gold);
      margin: 8px 0 14px;
      direction: ltr;
      overflow-wrap: anywhere;
    }

    .contact-box p {
      color: #b8cfe5;
      margin-bottom: 20px;
      max-width: 520px;
    }
    .contact-box .btn.outline { border-color: rgba(255, 255, 255, 0.4); }
    .contact-box .btn.primary { color: #1a1508; }

    footer {
      background: #061529;
      color: #8fa8c4;
      text-align: center;
      padding: 20px 0;
      font-size: 0.88rem;
    }

    @media (max-width: 900px) {
      .navbar { flex-wrap: wrap; padding: 10px 0; }
      nav { order: 3; width: 100%; gap: 2px; }
      .hero-grid {
        grid-template-columns: 1fr;
        gap: 32px;
        text-align: center;
      }
      .intro { margin-inline: auto; }
      .actions { justify-content: center; }
      .portrait {
        max-width: 220px;
        margin-inline: auto;
        grid-row: 1;
      }
      .skills-grid, .cv-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 560px) {
      .hero { padding: 48px 0 64px; }
      .stats {
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: -28px;
      }
      .stat { padding: 16px 12px; }
      section { padding: 48px 0; }
      .skills-grid, .cv-grid { grid-template-columns: 1fr; }
      nav {
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
      }
      nav a { white-space: nowrap; padding: 7px 10px; }
      .card { padding: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; }
    }

    [dir="rtl"] .card ul {
      padding-inline-start: 0;
      padding-inline-end: 18px;
    }
  </style>
</head>
<body>
<header>
  <div class="container navbar">
    <a class="logo" href="#top">B. JOUINI</a>
    <nav id="nav" aria-label="Navigation principale"></nav>
    <div class="tools">
      <div class="lang" aria-label="Choisir la langue">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="ar" aria-pressed="false">عربي</button>
      </div>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="container hero-grid">
      <div>
        <span class="eyebrow" id="eyebrow"></span>
        <h1>Belhassen<br>JOUINI</h1>
        <p class="role" id="role"></p>

        <div class="actions">
          <a class="btn primary" href="#cv" id="heroCv"></a>
          <a class="btn outline" href="#contact" id="heroContact"></a>
        </div>
      </div>
      <img class="portrait" src="1000093468.png" alt="Portrait de Belhassen Jouini" width="300" height="375" loading="eager" onerror="this.onerror=null;this.src='photo.jpg';this.onerror=function(){this.style.display='none'}">
    </div>
  </section>

  <div class="container stats" id="stats"></div>

  <section id="profil">
    <div class="container">
      <h2 class="section-title" id="aboutTitle"></h2>

  <section class="alternate" id="exp">

  <section id="skills">
    <div class="container">

  <section class="alternate" id="formation">

  </section>

  <section id="cv">
    <div class="container">
      <h2 class="section-title" id="cvTitle"></h2>
      <p class="about" id="cvIntro"></p>

    </div>
  </section>

  <section id="contact">
    <div class="container">
      <div class="contact-box">
        <h2 class="section-title" id="contactTitle"></h2>
        <a class="email" id="emailLink" href="mailto:jouinibelhassen715@gmail.com">jouinibelhassen715@gmail.com</a>
        <p id="contactText"></p>
        <div class="actions">
          <a class="btn primary" id="emailButton" href="mailto:jouinibelhassen715@gmail.com"></a>
          <a class="btn outline" id="whatsapp" href="https://wa.me/21624292113" target="_blank" rel="noopener noreferrer">WhatsApp</a>
          <a class="btn outline" href="https://www.linkedin.com/in/belhassen-jouini-b397b112a/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </div>
        <p id="location" style="margin-top:16px;margin-bottom:0;opacity:0.85"></p>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="container" id="footer"></div>
</footer>
