
<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Belhassen Jouini | Logistique & Gestion des stocks</title>
  <meta name="description" content="Belhassen Jouini : professionnel de la logistique, gestion des stocks, opérations d’entrepôt et e-commerce. CV disponibles pour la Tunisie, l’Europe et le Canada.">
  <meta name="theme-color" content="#082c60">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #082c60;
      --blue: #1677c8;
      --gold: #d9b56d;
      --pale: #edf4fc;
      --ink: #14233b;
      --muted: #586982;
      --line: #dce6f2;
      --white: #fff;
      --radius: 20px;
      --shadow: 0 12px 35px rgba(8, 44, 96, .09);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      margin: 0;
      font-family: "Cairo", Arial, sans-serif;
      color: var(--ink);
      line-height: 1.8;
      background: var(--white);
    }

    a { color: inherit; text-decoration: none; }

    a:focus-visible, button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 4px;
    }

    .container {
      width: min(1100px, 92%);
      margin-inline: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .navbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .logo {
      font-weight: 900;
      color: var(--navy);
      font-size: 1.2rem;
      white-space: nowrap;
    }

    nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: .9rem;
      font-weight: 700;
    }

    nav a:hover { color: var(--blue); }

    .tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang button {
      border: 1px solid var(--line);
      background: white;
      padding: 7px 10px;
      border-radius: 9px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .lang button[aria-pressed="true"] {
      background: var(--navy);
      color: white;
    }

    .hero {
      position: relative;
      overflow: hidden;
      color: white;
      padding: 82px 0 100px;
      background:
        radial-gradient(ellipse at 85% 20%, rgba(22,119,200,.5), transparent 45%),
        linear-gradient(135deg, #061e42, #0a3b7d);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 340px;
      height: 340px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 50%;
      inset-inline-end: -120px;
      bottom: -180px;
      box-shadow: 0 0 0 35px rgba(255,255,255,.025),
                  0 0 0 70px rgba(255,255,255,.025);
    }

    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 55px;
      align-items: center;
    }

    .eyebrow {
      display: inline-block;
      color: #f1d69c;
      border: 1px solid rgba(217,181,109,.5);
      background: rgba(217,181,109,.08);
      padding: 5px 15px;
      border-radius: 30px;
      font-size: .9rem;
      font-weight: 700;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 6vw, 4.8rem);
      line-height: 1.12;
      letter-spacing: -.03em;
      font-weight: 900;
    }

    .role {
      color: #a9d8ff;
      font-size: clamp(1.05rem, 2.5vw, 1.4rem);
      font-weight: 800;
      margin: 20px 0 10px;
    }

    .intro {
      max-width: 620px;
      color: #e0eaf7;
      font-size: 1.05rem;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 11px 20px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: white;
      color: var(--navy);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s, background .2s;
    }

    .btn:hover { transform: translateY(-2px); }

    .btn.primary {
      background: var(--gold);
      color: #182844;
      border-color: var(--gold);
    }

    .btn.outline {
      background: transparent;
      color: white;
      border-color: rgba(255,255,255,.65);
    }

    .portrait {
      max-width: 340px;
      width: 100%;
      justify-self: center;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      object-position: center top;
      border-radius: 48% 48% 22px 22px;
      border: 5px solid rgba(255,255,255,.3);
      box-shadow: 0 24px 60px rgba(0,0,0,.25);
      background: #e8f0fa;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: -40px;
      position: relative;
      z-index: 2;
    }

    .stat {
      text-align: center;
      background: white;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 18px;
      padding: 22px 10px;
    }

    .stat strong {
      display: block;
      color: var(--navy);
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      font-weight: 900;
      line-height: 1.4;
    }

    .stat span {
      color: var(--muted);
      font-size: .9rem;
      font-weight: 700;
    }

    section { padding: 75px 0; }

    section.alternate { background: var(--pale); }

    .section-title {
      color: var(--navy);
      font-size: clamp(1.7rem, 4vw, 2.3rem);
      font-weight: 900;
      margin: 0 0 30px;
    }

    .section-title::after {
      content: "";
      display: block;
      width: 58px;
      height: 4px;
      margin-top: 10px;
      background: var(--gold);
      border-radius: 4px;
    }

    .about {
      max-width: 850px;
      font-size: 1.08rem;
      color: #35445b;
    }

    .timeline {
      display: grid;
      gap: 18px;
    }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .date {
      display: inline-block;
      background: var(--pale);
      color: var(--blue);
      border-radius: 7px;
      padding: 3px 11px;
      font-size: .85rem;
      font-weight: 800;
    }

    .card h3 {
      color: var(--navy);
      margin: 10px 0 3px;
      font-size: 1.15rem;
    }

    .company {
      color: var(--muted);
      font-weight: 700;
      margin: 0 0 8px;
    }

    .card ul { padding-inline-start: 22px; margin-bottom: 0; }

    .card li { margin-bottom: 5px; }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 17px;
    }

    .skill {
      border-top: 4px solid var(--gold);
    }

    .skill h3 { margin-top: 0; }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tag {
      display: inline-block;
      background: var(--pale);
      color: var(--navy);
      border-radius: 7px;
      padding: 4px 10px;
      font-size: .84rem;
      font-weight: 700;
    }

    .education-list {
      display: grid;
      gap: 12px;
    }

    .education-list .card { box-shadow: none; }

    .cv-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .cv-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .cv-icon { font-size: 2rem; }

    .cv-card p {
      color: var(--muted);
      flex: 1;
      margin: 0 0 10px;
    }

    .cv-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .contact-box {
      background: linear-gradient(135deg, #061e42, #0a3b7d);
      color: white;
      border-radius: 26px;
      padding: clamp(25px, 5vw, 55px);
    }

    .contact-box .section-title { color: white; }

    .email {
      display: inline-block;
      color: #f1d69c;
      font-size: clamp(1rem, 3.5vw, 1.7rem);
      font-weight: 800;
      overflow-wrap: anywhere;
      border-bottom: 2px solid var(--gold);
      direction: ltr;
    }

    .contact-box p { color: #d8e5f7; }

    footer {
      background: #051a38;
      color: #d8e5f7;
      text-align: center;
      padding: 22px 0;
      font-size: .9rem;
    }

    @media (max-width: 850px) {
      .navbar { flex-wrap: wrap; padding: 12px 0; }
      nav { order: 3; width: 100%; gap: 14px; }
      .hero-grid { grid-template-columns: 1fr; gap: 35px; }
      .portrait { max-width: 250px; grid-row: 1; }
      .skills-grid, .cv-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 560px) {
      .hero { padding: 55px 0 75px; }
      .stats { gap: 7px; }
      .stat { padding: 15px 5px; }
      .stat span { font-size: .72rem; }
      section { padding: 52px 0; }
      .skills-grid, .cv-grid { grid-template-columns: 1fr; }
      .card { padding: 19px; }
      nav { overflow-x: auto; flex-wrap: nowrap; white-space: nowrap; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }

  const $ = id => document.getElementById(id);
  let currentLang = "fr";

  function addText(tag, text, className) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    el.textContent = text;
    return el;
  }

  function render() {
    const d = content[currentLang];
    const arabic = currentLang === "ar";

    document.documentElement.lang = currentLang;
    document.documentElement.dir = arabic ? "rtl" : "ltr";

    $("nav").replaceChildren(...d.nav.map(([label, href]) => {
      const a = addText("a", label);
      a.href = "#" + href;
      return a;
    }));

    [
      ["eyebrow", "eyebrow"],
      ["role", "role"],
      ["intro", "intro"],
      ["heroCv", "heroCv"],
      ["heroContact", "heroContact"],
      ["aboutTitle", "aboutTitle"],
      ["about", "about"],
      ["expTitle", "expTitle"],
      ["skillsTitle", "skillsTitle"],
      ["eduTitle", "eduTitle"],
      ["cvTitle", "cvTitle"],
      ["cvIntro", "cvIntro"],
      ["contactTitle", "contactTitle"],
      ["emailButton", "emailButton"],
      ["contactText", "contactText"],
      ["location", "location"],
      ["footer", "footer"]
    ].forEach(([id, key]) => $(id).textContent = d[key]);

    $("stats").replaceChildren(...d.stats.map(([value, label]) => {
      const box = document.createElement("div");
      box.className = "stat";
      box.append(addText("strong", value), addText("span", label));
      return box;
    }));

    $("jobs").replaceChildren(...d.jobs.map(job => {
      const article = document.createElement("article");
      article.className = "card";
      article.append(addText("span", job.date, "date"));
      article.append(addText("h3", job.title));
      article.append(addText("p", job.company, "company"));

      const ul = document.createElement("ul");
      job.bullets.forEach(text => ul.append(addText("li", text)));
      article.append(ul);
      return article;
    }));

    $("skillsList").replaceChildren(...d.skills.map(([title, tags]) => {
      const card = document.createElement("article");
      card.className = "card skill";
      card.append(addText("h3", title));

      const tagList = document.createElement("div");
      tagList.className = "tags";
      tags.forEach(tag => tagList.append(addText("span", tag, "tag")));
      card.append(tagList);
      return card;
    }));

    $("education").replaceChildren(...d.education.map(([title, detail]) => {
      const card = document.createElement("article");
      card.className = "card";
      card.append(addText("h3", title));
      card.append(addText("p", detail));
      return card;
    }));

    $("cvList").replaceChildren(...d.cvs.map(([icon, title, desc, file]) => {
      const card = document.createElement("article");
      card.className = "card cv-card";
      card.append(addText("span", icon, "cv-icon"));
      card.append(addText("h3", title));
      card.append(addText("p", desc));

      const actions = document.createElement("div");
      actions.className = "cv-actions";

      const view = addText("a", d.view, "btn");
      view.href = file;
      view.target = "_blank";
      view.rel = "noopener noreferrer";

      const download = addText("a", d.download, "btn primary");
      download.href = file;
      download.setAttribute("download", file);

      actions.append(view, download);
      card.append(actions);
      return card;
    }));

    document.querySelectorAll("[data-lang]").forEach(button => {
      button.setAttribute(
        "aria-pressed",
        String(button.dataset.lang === currentLang)
      );
    });

    document.title = arabic
      ? "بلحسن الجويني | اللوجستيك وتسيير المخزون"
      : "Belhassen Jouini | Logistique & Gestion des stocks";

    try {
      localStorage.setItem("portfolio-language", currentLang);
    } catch (_) {}
  }

  document.querySelectorAll("[data-lang]").forEach(button => {
    button.addEventListener("click", () => {
      currentLang = button.dataset.lang;
      render();
    });
  });

  try {
    const saved = localStorage.getItem("portfolio-language");
    if (saved === "ar" || saved === "fr") currentLang = saved;
  } catch (_) {}

  render();
