const cuo=new IntersectionObserver((es,o)=>es.forEach(e=>{if(!e.isIntersecting)return;o.unobserve(e.target);const el=e.target,txt=el.textContent,m=txt.match(/\d+/);if(!m||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const n=+m[0],t0=performance.now();const st=now=>{const p=Math.min((now-t0)/1000,1);el.textContent=txt.replace(/\d+/,Math.round(n*p));if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)}),{threshold:.6});
function fx(){
document.querySelectorAll('section .wrap>*,.job,.sk,.cvc').forEach(el=>{if(!el.classList.contains('in')){el.classList.add('rv');rvo.observe(el)}});
document.querySelectorAll('#kpi b').forEach(b=>cuo.observe(b));
}
addEventListener('scroll',()=>{const h=document.documentElement;$('prog').style.width=(h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});
function setLang(l){
const i=l==='fr'?0:1,t=k=>D[k][i];
document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
$('nav').innerHTML=['profil','exp','skills','edu','cv','contact'].map((h,n)=>`<a href="#${h}">${D.nav[n][i]}</a>`).join('');
['role','lede','cta1','cta2','hCv','hAbout','about','hExp','hSkill','hEdu','hCvs','cvP','hCt'].forEach(k=>$(k).textContent=t(k));
$('kpi').innerHTML=D.kpi.map(k=>`<div><b dir="ltr">${k[0]}</b><span>${k[i+1]}</span></div>`).join('');
$('jobs').innerHTML=D.jobs.map(j=>`<article class="job"><time>${j.d[i]}</time><div><h3>${j.t[i]}</h3><p class="org">${j.o}</p><ul>${j.b.map(b=>`<li>${b[i]}</li>`).join('')}</ul></div></article>`).join('');
$('skillList').innerHTML=D.skills.map(s=>`<div class="sk"><h3>${s[0][i]}</h3><div class="chips">${s[1][i].split(/[,،]\s*/).map(x=>`<span>${x}</span>`).join('')}</div></div>`).join('');
$('eduList').innerHTML=D.edu.map(e=>`<p>${e[i]}</p>`).join('');
$('cvList').innerHTML=D.cvs.map((c,n)=>`<div class="cvc"><div class="fl">${['🇪🇺','🇹🇳','🇨🇦'][n]}</div><h3>${c[1][i]}</h3><p>${c[2][i]}</p><div class="act"><a class="btn sm" href="${c[0]}" target="_blank" rel="noopener">${t('view')}</a><a class="btn main sm" href="${c[0]}" download="Belhassen-Jouini-CV-${['Europe','Tunisie','Canada-ATS'][n]}.pdf">${t('dl')}</a></div></div>`).join('');
$('mail').textContent=P.mail;$('mail').href='mailto:'+P.mail;
$('ctBtns').innerHTML=`<a class="btn main" href="mailto:${P.mail}">${D.wmail[i]}</a><a class="btn" href="https://wa.me/${P.tel.replace(/\D/g,'')}" target="_blank" rel="noopener">WhatsApp</a><a class="btn" href="${P.in}" target="_blank" rel="noopener">LinkedIn</a>`;
$('ctList').innerHTML=`<li>${D.ct[0][i]} · <a href="tel:${P.tel.replace(/\s/g,'')}">${P.tel}</a></li><li>${D.ct[1][i]}</li>`;
$('foot').textContent=t('foot');
$('tag').textContent=D.ct[0][i];
D.chips.forEach((c,n)=>$('ch'+(n+1)).innerHTML=`<b>${c[i][0]}</b><span>${c[i][1]}</span>`);
fx();
document.title=l==='fr'?'Belhassen Jouini — Gestion des stocks et logistique':'Belhassen Jouini — تسيير المخزون واللوجستيك';
document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
try{localStorage.setItem('pf_lang',l)}catch(e){}
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
let l0;try{l0=localStorage.getItem('pf_lang')}catch(e){}
setLang(l0==='ar'||l0==='fr'?l0:'fr');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id))}),{rootMargin:'-45% 0px -50% 0px'});
['profil','exp','skills','edu','cv','contact'].forEach(id=>io.observe($(id)));
</script>
</body>
</html>
